apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collage.fullname" . }}-backend
  labels:
    app: backend

spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP

          env:
            - name: DB_HOST
              value: {{ .Values.backend.env.DB_HOST | quote }}

            - name: DB_PORT
              value: {{ .Values.backend.env.DB_PORT | quote }}

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "collage.fullname" . }}-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "collage.fullname" . }}-secret
                  key: DB_PASSWORD

            - name: DB_NAME
              value: {{ .Values.backend.env.DB_NAME | quote }}

          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

      nodeSelector:
        {{- toYaml .Values.backend.nodeSelector | nindent 8 }}

      tolerations:
        {{- toYaml .Values.backend.tolerations | nindent 8 }}
