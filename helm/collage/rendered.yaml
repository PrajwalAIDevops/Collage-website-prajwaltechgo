---
# Source: collage/templates/mysql-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collage-mysql
  labels:
    app: mysql

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql
          image: "mysql:8.0"
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: collage-secret
                  key: DB_PASSWORD

            - name: MYSQL_DATABASE
              value: "college_platform"

          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi

      nodeSelector:
        role: database

      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: database
